# Echo menerima chat dari orang yang tidak dikenal, jadi TIDAK diberi alat apa pun:
# tidak ada terminal, berkas, browser, atau memori. Ia hanya bisa membalas teks.
model:
  default: deepseek/deepseek-v4.1-flash
  provider: fenrir
providers:
  fenrir:
    base_url: https://oni.lio.id/v1
    key_env: FENRIR_API_KEY
    api_mode: chat_completions
    discover_models: true
agent:
  reasoning_effort: low
  max_turns: 6
platform_toolsets:
  whatsapp: []
  whatsapp_cloud: []
  cli: []
# WhatsApp pada profil selain profil utama hanya dilayani oleh gateway milik profil itu sendiri.
gateway:
  standalone: true
# Balasan ke pelanggan tanpa awalan "Hermes Agent".
whatsapp:
  reply_prefix: ""
